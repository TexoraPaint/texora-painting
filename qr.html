/* ---- quote dialog (js/tx-quote-dialog.js builds it at click time from the page's own form card) ---- */
dialog.tx-quote-dialog{box-sizing:border-box;width:min(560px,calc(100vw - 24px));max-width:none;max-height:none;margin:auto;padding:0;border:0;background:transparent;color:var(--blue,#1a3a6e);overflow:visible}
dialog.tx-quote-dialog::backdrop{background:rgba(8,25,54,.66)}
.tx-qd-body{position:relative;box-sizing:border-box;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;border-radius:var(--r-card,14px);background:#fff;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.tx-qd-close{position:absolute;top:6px;right:6px;z-index:2;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:var(--r-chrome,8px);background:transparent;color:var(--blue,#1a3a6e);font:400 30px/1 Arial,sans-serif;cursor:pointer}
.tx-qd-close:hover{background:#eef2f9}
.tx-qd-close:focus-visible{outline:3px solid var(--blue,#1a3a6e);outline-offset:-3px}
dialog.tx-quote-dialog .tx-hero-form,dialog.tx-quote-dialog .form-card{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;background:#fff;padding:36px 28px 26px}
dialog.tx-quote-dialog .tx-hero-form h2,dialog.tx-quote-dialog .form-card h3{padding-right:40px}
html:has(dialog.tx-quote-dialog[open]){overflow:hidden}
@media(max-width:600px){dialog.tx-quote-dialog{width:calc(100vw - 16px)}dialog.tx-quote-dialog .tx-hero-form,dialog.tx-quote-dialog .form-card{padding:34px 18px 22px}}
@media print{dialog.tx-quote-dialog{display:none!important}}
dialog.tx-quote-dialog .tx-qd-scope{padding:0;margin:0;background:transparent}

.tx-card,.tx-split,.tx-grid{--tx-layout:1}

.tx-section-cta a:hover{background:var(--orange-dark,#d96a10)}
.tx-section-cta a:focus-visible{outline:3px solid var(--blue,#1a3a6e);outline-offset:3px}
.svc-gallery>.tx-section-cta{padding:0}

/* ---- row 284: one radius scale: 12 (card + tile), 10 (panel), 8 (chrome) and the pill. The card rung (14px) folds into the 12px tile rung so no container
   carries a value that only one element on a page uses; literal radii on page-local cards land on the same tokens ---- */
:root{--r-card:12px}
html body #txaCookie{border-radius:var(--r-panel,10px)}

/* ---- row 228: a band that repeats the tint above it gets the hairline and a taller top padding ---- */

<main><!-- COOKIE CONSENT (branded, dismissible, remembers choice) -->
<style>
 #txaCookie{position:fixed;left:20px;bottom:20px;z-index:3000;max-width:380px;width:calc(100% - 40px);
   background:linear-gradient(160deg,#12244f 0%,#0d1c40 100%);color:#fff;border:1px solid rgba(255,255,255,.12);
   border-radius:16px;padding:20px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45);
   font-family:'Open Sans','Open Sans Fallback',Arial,sans-serif;transform:translateY(160%);opacity:0;
   transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .5s;}
 #txaCookie.cc-show{transform:none;opacity:1;}
 #txaCookie .cc-h{display:flex;align-items:center;gap:9px;font-family:'Montserrat','Montserrat Fallback',Arial,sans-serif;font-weight:800;font-size:16px;margin-bottom:8px;}
 #txaCookie .cc-emoji{font-size:20px;line-height:1;}
 #txaCookie p{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.82);margin:0 0 16px;}
 #txaCookie a{color:#f9b25a;font-weight:700;text-decoration:underline;}
 #txaCookie .cc-btns{display:flex;gap:10px;}
 #txaCookie .cc-accept{flex:1;background:#f47b20;color:#fff;border:none;font-family:'Montserrat','Montserrat Fallback',Arial,sans-serif;font-weight:800;font-size:14px;padding:12px 16px;border-radius:10px;cursor:pointer;box-shadow:0 6px 18px rgba(244,123,32,.4);transition:background .2s,transform .12s;}
 #txaCookie .cc-accept:hover{background:#d96a10;} #txaCookie .cc-accept:active{transform:scale(.98);}
 #txaCookie .cc-decline{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.28);font-family:'Montserrat','Montserrat Fallback',Arial,sans-serif;font-weight:700;font-size:14px;padding:12px 18px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s;}
 #txaCookie .cc-decline:hover{background:rgba(255,255,255,.08);color:#fff;}
 #txaCookie:focus-within{outline:none;}
 @media(max-width:480px){#txaCookie{left:12px;right:12px;bottom:12px;width:auto;max-width:none;}}
 @media(prefers-reduced-motion:reduce){#txaCookie{transition:opacity .3s ease;transform:none;}}
</style>
<div id="txaCookie" role="dialog" aria-label="Cookie notice" aria-live="polite" hidden>
  <div class="cc-h"><span class="cc-emoji" aria-hidden="true">🍪</span> Cookie Settings</div>
  <p>We use cookies to improve your experience and understand our traffic. See our <a href="/privacy-policy.html">Privacy Policy</a> &amp; <a href="/cookie-policy.html">Cookie Policy</a>.</p>
  <div class="cc-btns">
    <button class="cc-accept" type="button">Accept All</button>
    <button class="cc-decline" type="button">Decline</button>
  </div>
</div>
<script>
(function(){var K="txa_cookie",el=document.getElementById("txaCookie");if(!el)return;
 var v=null;try{v=localStorage.getItem(K);}catch(e){}
 if(v){el.parentNode&&el.parentNode.removeChild(el);return;}
 el.hidden=false;setTimeout(function(){el.classList.add("cc-show");},1200);
 function done(val){try{localStorage.setItem(K,val);}catch(e){}el.classList.remove("cc-show");setTimeout(function(){el.parentNode&&el.parentNode.removeChild(el);},480);}
 el.querySelector(".cc-accept").addEventListener("click",function(){done("accepted");});
 el.querySelector(".cc-decline").addEventListener("click",function(){try{window["ga-disable-G-H03RYY12LT"]=true;}catch(e){}done("declined");});
})();
</script>
</main>
