<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Review Island Preview | Texora Painting</title>
<style>
:root{--blue:#1a3a6e;--orange:#f47b20;--dark:#111827;--gray:#6b7280;--off-white:#f4f7fb;--star:#fbbc04}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--off-white);color:var(--dark);min-height:200vh}
.demo{padding:110px 20px 40px;max-width:640px;margin:0 auto}
.demo h1{color:var(--blue);font-size:1.5rem}

/* ---------- Review island ---------- */
.ri-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:8px;
  background:#000;color:#fff;border:0;cursor:pointer;font:600 13px/1 inherit;font-family:inherit;
  white-space:nowrap;padding:8px 14px;border-radius:0 0 16px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ri-bar .st{color:var(--star);letter-spacing:1px}
.ri-bar .ct{opacity:.75;font-weight:500}
/* iPhone: dynamic-island-style capsule tucked right under the island / status bar */
@media (hover:none) and (pointer:coarse) and (max-width:480px){
  .ri-bar{top:calc(env(safe-area-inset-top,0px) + 6px);border-radius:999px;padding:7px 14px;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.35);
    transition:transform .35s cubic-bezier(.32,1.4,.5,1)}
  .ri-bar:active{transform:translateX(-50%) scale(.94)}
}
.ri-bar.pop{animation:ripop .5s cubic-bezier(.32,1.4,.5,1)}
@keyframes ripop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ri-bar.pop{animation:none}}

/* ---------- Modal ---------- */
.ri-modal{position:fixed;inset:0;z-index:9999;display:none;background:rgba(0,0,0,.55)}
.ri-modal.open{display:block}
.ri-sheet{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);
  width:min(560px,calc(100% - 20px));max-height:calc(100% - 30px);overflow:auto;background:#fff;border-radius:24px;padding:18px}
.ri-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ri-head b{font-size:1.05rem;color:var(--blue)}
.ri-x{border:0;background:var(--off-white);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.ri-tabs{display:flex;gap:6px;margin-bottom:14px}
.ri-tab{flex:1;border:1px solid #e5e9f2;background:#fff;border-radius:999px;padding:8px;font-weight:600;font-size:.85rem;cursor:pointer}
.ri-tab[aria-selected=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.ri-card{border:1px solid #e5e9f2;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ri-card .n{font-weight:600}.ri-card .s{color:var(--star)}.ri-card p{margin:6px 0 0;font-size:.9rem;color:#374151}
.ri-src{font-size:.75rem;color:var(--gray)}
#ri-elfsight{min-height:120px}
</style>
</head>
<body>
<div class="demo">
  <h1>Review Island — preview</h1>
  <p>On iPhone the pill sits just under the Dynamic Island. Elsewhere it's a small tab at top-center. Tap it.</p>
</div>

<button class="ri-bar pop" id="riOpen" aria-haspopup="dialog" aria-label="Open customer reviews">
  <span class="st" aria-hidden="true">★★★★★</span><span id="riRating">5.0</span><span class="ct">· <span id="riCount">42</span> reviews</span>
</button>

<div class="ri-modal" id="riModal" role="dialog" aria-modal="true" aria-label="Customer reviews">
  <div class="ri-sheet">
    <div class="ri-head"><b>Texora Painting reviews</b><button class="ri-x" id="riClose" aria-label="Close">×</button></div>
    <div class="ri-tabs" role="tablist">
      <button class="ri-tab" role="tab" aria-selected="true" data-t="google">Google</button>
      <button class="ri-tab" role="tab" aria-selected="false" data-t="facebook">Facebook</button>
      <button class="ri-tab" role="tab" aria-selected="false" data-t="bbb">BBB</button>
    </div>
    <div id="riList"></div>
    <!-- Elfsight All-in-One Reviews goes here (lazy-loaded on first open) -->
    <div id="ri-elfsight"></div>
  </div>
</div>

<script>
(function(){
  var ELFSIGHT_ID = 'caf38022-a2fa-4edf-b0b3-443c05d5f137'; // Elfsight Google Reviews (free plan, Google-only)
  var open=document.getElementById('riOpen'),modal=document.getElementById('riModal'),list=document.getElementById('riList');
  var loaded=false;
  // Placeholder cards for the preview only
  var demo={google:[["Sample Customer","Beautiful, clean work — on time and on budget."],["Sample Customer","Our exterior looks brand new. Highly recommend."]],
            facebook:[["Sample Customer","Great crew, great communication."]],bbb:[["Sample Customer","Professional from quote to finish."]]};
  function render(t){list.innerHTML=demo[t].map(function(r){return '<div class="ri-card"><span class="n">'+r[0]+'</span> <span class="s">★★★★★</span><p>'+r[1]+'</p><span class="ri-src">via '+t+'</span></div>'}).join('')}
  function loadElfsight(){
    if(loaded||!ELFSIGHT_ID)return;loaded=true;
    var d=document.getElementById('ri-elfsight');d.className='elfsight-app-'+ELFSIGHT_ID;d.setAttribute('data-elfsight-app-lazy','');
    var s=document.createElement('script');s.src='https://elfsightcdn.com/platform.js';s.async=true;document.body.appendChild(s);
    list.style.display='none';document.querySelector('.ri-tabs').style.display='none';
  }
  // Live rating from existing feed when available; keep schema values (5.0 / 42) otherwise
  fetch('/.netlify/functions/reviews').then(function(r){return r.json()}).then(function(j){
    if(j&&j.rating){document.getElementById('riRating').textContent=Number(j.rating).toFixed(1);document.getElementById('riCount').textContent=j.total}
  }).catch(function(){});
  function show(){modal.classList.add('open');document.body.style.overflow='hidden';loadElfsight();document.getElementById('riClose').focus()}
  function hide(){modal.classList.remove('open');document.body.style.overflow='';open.focus()}
  open.onclick=show;document.getElementById('riClose').onclick=hide;
  modal.addEventListener('click',function(e){if(e.target===modal)hide()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  document.querySelectorAll('.ri-tab').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('.ri-tab').forEach(function(x){x.setAttribute('aria-selected',x===b)});render(b.dataset.t)}});
  render('google');
})();
</script>
</body>
</html>
