<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Review Island Preview | Texora Painting</title>
<style>
:root{--blue:#1a3a6e;--orange:#f47b20;--dark:#111827;--gray:#6b7280;--off-white:#f4f7fb;--star:#fbbc04}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--off-white);color:var(--dark);min-height:200vh}
.demo{padding:110px 20px 40px;max-width:640px;margin:0 auto}
.demo h1{color:var(--blue);font-size:1.5rem}

/* ---------- Review island ---------- */
.ri-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:8px;
  background:#000;color:#fff;border:0;cursor:pointer;font:600 13px/1 inherit;font-family:inherit;
  white-space:nowrap;padding:8px 14px;border-radius:0 0 16px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ri-bar .st{color:var(--star);letter-spacing:1px}
.ri-bar .ct{opacity:.75;font-weight:500}
/* iPhone: dynamic-island-style capsule tucked right under the island / status bar */
@media (hover:none) and (pointer:coarse) and (max-width:480px){
  .ri-bar{top:calc(env(safe-area-inset-top,0px) + 6px);border-radius:999px;padding:7px 14px;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.35);
    transition:transform .35s cubic-bezier(.32,1.4,.5,1)}
  .ri-bar:active{transform:translateX(-50%) scale(.94)}
}
.ri-bar.pop{animation:ripop .5s cubic-bezier(.32,1.4,.5,1)}
@keyframes ripop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ri-bar.pop{animation:none}}

/* ---------- Modal ---------- */
.ri-modal{position:fixed;inset:0;z-index:9999;display:none;background:rgba(0,0,0,.55)}
.ri-modal.open{display:block}
.ri-sheet{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);
  width:min(560px,calc(100% - 20px));max-height:calc(100% - 30px);overflow:auto;background:#fff;border-radius:24px;padding:18px}
.ri-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ri-head b{font-size:1.05rem;color:var(--blue)}
.ri-x{border:0;background:var(--off-white);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.ri-tabs{display:flex;gap:6px;margin-bottom:14px}
.ri-tab{flex:1;border:1px solid #e5e9f2;background:#fff;border-radius:999px;padding:8px;font-weight:600;font-size:.85rem;cursor:pointer}
.ri-tab[aria-selected=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.ri-card{border:1px solid #e5e9f2;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ri-card .n{font-weight:600}.ri-card .s{color:var(--star)}.ri-card p{margin:6px 0 0;font-size:.9rem;color:#374151}
.ri-src{font-size:.75rem;color:var(--gray)}
#ri-elfsight{min-height:120px}
</style>
<!-- callrail swap.js (bloomview 2026-09-27) -->
<script>(function(){if(!/(^|\.)texorapainting\.com$/.test(location.hostname))return;var s=document.createElement('script');s.async=1;s.src='https://cdn.callrail.com/companies/964140765/4482de884bd82f9e5505/12/swap.js';var go=function(){(document.head||document.documentElement).appendChild(s);};if(document.readyState==='complete')go();else window.addEventListener('load',go,{once:true});})();</script>
<style data-tx-inline="tx-v2">/* tx-v2: round-2 visual/QA layer (lane V). Source of truth for the <style data-tx-inline="tx-v2"> block that
   scripts/inline_v2.py writes at the end of <head> on every page except home, About, go/* and the legal pages.
   EDIT THIS FILE, THEN RUN scripts/inline_v2.py. Values reuse the declared tokens in css/bb-structure.css. */

/* ---- quote dialog (js/tx-quote-dialog.js builds it at click time from the page's own form card) ---- */
dialog.tx-quote-dialog{box-sizing:border-box;width:min(560px,calc(100vw - 24px));max-width:none;max-height:none;margin:auto;padding:0;border:0;background:transparent;color:var(--blue,#1a3a6e);overflow:visible}
dialog.tx-quote-dialog::backdrop{background:rgba(8,25,54,.66)}
.tx-qd-body{position:relative;box-sizing:border-box;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;border-radius:var(--r-card,14px);background:#fff;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.tx-qd-close{position:absolute;top:6px;right:6px;z-index:2;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:var(--r-chrome,8px);background:transparent;color:var(--blue,#1a3a6e);font:400 30px/1 Arial,sans-serif;cursor:pointer}
.tx-qd-close:hover{background:#eef2f9}
.tx-qd-close:focus-visible{outline:3px solid var(--blue,#1a3a6e);outline-offset:-3px}
dialog.tx-quote-dialog .tx-hero-form,dialog.tx-quote-dialog .form-card{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;background:#fff;padding:36px 28px 26px}
dialog.tx-quote-dialog .tx-hero-form h2,dialog.tx-quote-dialog .form-card h3{padding-right:40px}
html:has(dialog.tx-quote-dialog[open]){overflow:hidden}
@media(max-width:600px){dialog.tx-quote-dialog{width:calc(100vw - 16px)}dialog.tx-quote-dialog .tx-hero-form,dialog.tx-quote-dialog .form-card{padding:34px 18px 22px}}
@media print{dialog.tx-quote-dialog{display:none!important}}
dialog.tx-quote-dialog .tx-qd-scope{padding:0;margin:0;background:transparent}

/* ---- layout tokens: marker classes the markup carries so layout containers (cards, column grids) are named
   in the stylesheet; no visual effect ---- */
.tx-card,.tx-split,.tx-grid{--tx-layout:1}

/* ---- row 291/292: one prose edge, no centred long prose. CTA bands read left like the hub CTA bands do ---- */
.cta-bar,.bb .cta-bar,.bb .svc-cta,.svc-cta{text-align:left}
.cta-bar>h2,.cta-bar>p,.bb .cta-bar>h2,.bb .cta-bar>p,.svc-cta>h2,.svc-cta>p,.bb .svc-cta>h2,.bb .svc-cta>p{text-align:left;margin-left:0;margin-right:0}
.cta-bar .bb-cta-actions,.bb .cta-bar .bb-cta-actions,.svc-cta .bb-cta-actions,.bb .svc-cta .bb-cta-actions{justify-content:flex-start}
.bb .bb-topic-grid>.bb-topic:last-child:nth-child(2n+3):not(:has(ul))>p{text-align:left}
.blog-hero .dek{text-align:left}

/* hub pages: same 1120px reading column and 20px phone gutter as every other band */
.tx-area{--area-width:1120px}
.tx-area section{padding-left:max(var(--bb-gutter,20px),calc((100% - var(--area-width))/2));padding-right:max(var(--bb-gutter,20px),calc((100% - var(--area-width))/2))}

/* ---- row 263: section-end quote button after the photo / before-after proof blocks (the page's own hero quote link) ---- */
.tx-section-cta{display:flex;justify-content:flex-start;box-sizing:border-box;max-width:1120px;margin:28px auto 0;padding:0 var(--bb-gutter,20px)}
.tx-section-cta a{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:48px;padding:13px 24px;border-radius:var(--r-chrome,8px);background:var(--orange,#f47b20);color:var(--tx-on-orange,#081c3b);font-family:var(--bb-head,'Montserrat','Montserrat Fallback',sans-serif);font-weight:800;font-size:14px;letter-spacing:.4px;line-height:1.3;text-decoration:none;box-shadow:var(--shadow-cta,0 6px 20px rgba(4,12,45,.3))}
.tx-section-cta a:hover{background:var(--orange-dark,#d96a10)}
.tx-section-cta a:focus-visible{outline:3px solid var(--blue,#1a3a6e);outline-offset:3px}
.svc-gallery>.tx-section-cta{padding:0}

/* ---- row 284: one radius scale: 12 (card + tile), 10 (panel), 8 (chrome) and the pill. The card rung (14px) folds into the 12px tile rung so no container
   carries a value that only one element on a page uses; literal radii on page-local cards land on the same tokens ---- */
:root{--r-card:12px}
html body #txaCookie{border-radius:var(--r-panel,10px)}
.form-card.form-card,.article-cta.article-cta,.review-box.review-box,.tx-hero-form.tx-hero-form,.ba-row.ba-row,.leave-review.leave-review,.review-card.review-card,.tx-photo-band.tx-photo-band{border-radius:var(--r-tile,12px)}
.nf-quick-links.nf-quick-links{border-radius:var(--r-panel,10px)}
@media(max-width:600px){.city-badge.city-badge,.svc-badge.svc-badge,.proj-badge.proj-badge{border-radius:var(--r-chrome,8px)}}

/* ---- row 228: a band that repeats the tint above it gets the hairline and a taller top padding ---- */
.bb main>.city-intro+.bb-band,.reviews-strip+.cta-bar,.cg-band--b+.faq-section{border-top:1px solid var(--bb-band-rule,#e3e8f0);padding-top:calc(var(--bb-pad,80px) + 16px)}

/* ---- row 472 / 291: transparent centred wrappers run full width and keep the shared reading column ---- */
.city-intro{max-width:none;margin:0;padding-left:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2));padding-right:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2))}
.reviews-section,.cta-bar{max-width:none;margin:0;padding-left:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2));padding-right:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2))}
.city-intro>.why-section{padding-left:0;padding-right:0}
main>p.tx-case-links{max-width:none;margin:0;box-sizing:border-box;padding-left:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2));padding-right:max(var(--bb-gutter,20px),calc((100% - var(--bb-max,1120px))/2))}

/* ---- row 260: paragraph measure stays under 75ch on the services hub too ---- */
.tx-area-towns>p:not(.place-credits),.tx-area-map-intro,.tx-area-closing>p,.tx-area-cta>p{max-width:70ch}

/* ---- row 292: process-step copy is prose; it reads left even inside the centred step cards ---- */
.bb-process .step p{text-align:left}
/* ---- row 273: hook class on the cost guide's first band (no visual rule) ---- */
.cg-band--a{box-sizing:border-box}</style>
</head>
<body>
<main>
<div class="demo">
  <h1>Review Island — preview</h1>
  <p>On iPhone the pill sits just under the Dynamic Island. Elsewhere it's a small tab at top-center. Tap it.</p>
</div>

<button class="ri-bar pop" id="riOpen" aria-haspopup="dialog" aria-label="Open customer reviews">
  <span class="st" aria-hidden="true">★★★★★</span><span id="riRating">5.0</span><span class="ct">· <span id="riCount">42</span> reviews</span>
</button>

<div class="ri-modal" id="riModal" role="dialog" aria-modal="true" aria-label="Customer reviews">
  <div class="ri-sheet">
    <div class="ri-head"><b>Texora Painting reviews</b><button class="ri-x" id="riClose" aria-label="Close">×</button></div>
    <div class="ri-tabs" role="tablist">
      <button class="ri-tab" role="tab" aria-selected="true" data-t="google">Google</button>
      <button class="ri-tab" role="tab" aria-selected="false" data-t="facebook">Facebook</button>
      <button class="ri-tab" role="tab" aria-selected="false" data-t="bbb">BBB</button>
    </div>
    <div id="riList"></div>
    <!-- Elfsight All-in-One Reviews goes here (lazy-loaded on first open) -->
    <div id="ri-elfsight"></div>
  </div>
</div>

<script>
(function(){
  var ELFSIGHT_ID = 'caf38022-a2fa-4edf-b0b3-443c05d5f137'; // Elfsight Google Reviews (free plan, Google-only)
  var open=document.getElementById('riOpen'),modal=document.getElementById('riModal'),list=document.getElementById('riList');
  var loaded=false;
  // Placeholder cards for the preview only
  var demo={google:[["Sample Customer","Beautiful, clean work — on time and on budget."],["Sample Customer","Our exterior looks brand new. Highly recommend."]],
            facebook:[["Sample Customer","Great crew, great communication."]],bbb:[["Sample Customer","Professional from quote to finish."]]};
  function render(t){list.innerHTML=demo[t].map(function(r){return '<div class="ri-card"><span class="n">'+r[0]+'</span> <span class="s">★★★★★</span><p>'+r[1]+'</p><span class="ri-src">via '+t+'</span></div>'}).join('')}
  function loadElfsight(){
    if(loaded||!ELFSIGHT_ID)return;loaded=true;
    var d=document.getElementById('ri-elfsight');d.className='elfsight-app-'+ELFSIGHT_ID;d.setAttribute('data-elfsight-app-lazy','');
    var s=document.createElement('script');s.src='https://elfsightcdn.com/platform.js';s.async=true;document.body.appendChild(s);
    list.style.display='none';document.querySelector('.ri-tabs').style.display='none';
  }
  // Live rating from existing feed when available; keep schema values (5.0 / 42) otherwise
  fetch('/.netlify/functions/reviews').then(function(r){return r.json()}).then(function(j){
    if(j&&j.rating){document.getElementById('riRating').textContent=Number(j.rating).toFixed(1);document.getElementById('riCount').textContent=j.total}
  }).catch(function(){});
  function show(){modal.classList.add('open');document.body.style.overflow='hidden';loadElfsight();document.getElementById('riClose').focus()}
  function hide(){modal.classList.remove('open');document.body.style.overflow='';open.focus()}
  open.onclick=show;document.getElementById('riClose').onclick=hide;
  modal.addEventListener('click',function(e){if(e.target===modal)hide()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  document.querySelectorAll('.ri-tab').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('.ri-tab').forEach(function(x){x.setAttribute('aria-selected',x===b)});render(b.dataset.t)}});
  render('google');
})();
</script>
</main>
</body>
</html>
