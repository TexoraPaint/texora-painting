# PR-only site checks. Runs on pull requests into main and nothing else.
# It never runs on a push, never deploys, uses no secrets, and does not touch Netlify:
# Netlify keeps auto-deploying main exactly as before.
name: site-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Section order + one H1 per page
        run: python3 scripts/check_section_order.py
      - name: Generator-token residue
        if: always()
        run: python3 scripts/check_token_residue.py
