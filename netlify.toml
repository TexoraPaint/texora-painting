# ── Netlify configuration ──────────────────────────────────────────────────────

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# HTML: always revalidate (so deploys go live instantly)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images: cache 1 year (immutable — filenames don't change often)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts: cache 1 year
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site manifest & XML: short cache
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Links stay as written (/page.html): Netlify's "Pretty URLs" post-processing used to rewrite every
# .html href to an extensionless path that the _redirects rules then 301 back to .html — one redirect
# on ~7,000 internal links. Off = the link in the source is the link the visitor follows.
[build.processing.html]
  pretty_urls = false
